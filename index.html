<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="src/style.css">
  <title>losanges Canvas</title>
</head>
<body>
  <canvas id="scene" aria-label="Animation d'losanges"></canvas>
  <canvas id="lettres" aria-label="Animation d'losanges"></canvas>
  <script type="module" src="/src/main.ts"></script>
  

  <div id="camera-controls" class="cross-grid">
    <button id="cameraYPlus" class="up">↑</button>
    <button id="cameraXMinus" class="left">←</button>
    <button id="cameraCenter" class="center">●</button>
    <button id="cameraXPlus" class="right">→</button>
    <button id="cameraYMinus" class="down">↓</button>
  </div>

  <div id ="zoom-controls" >
    <button id="zoomIn" class="up">+</button>
    <button id="zoomCenter" class="center">●</button>
    <button id="zoomOut" class="down">-</button>
  </div>
